# Release — Linux 单平台打包 + 直传 release 资产
# 骨架对齐 dsh-hanako release.yml（三段式：create-release → build → 资产直传），
# 按 github-hanako 交付物本质裁剪（纯 JS + 内嵌 win 运行时，零 npm 依赖）。
#
# 触发: push tag v*（发版打 tag 自动触发）或手动 workflow_dispatch
#
# 三段式:
#   - create-release（仅 tag 场景）: 先建 pre-release（已存在则跳过，--generate-notes）
#   - build（needs create-release）: ubuntu 单平台 setup-node + fetch-vendor（git/gh/gnupg，
#     vendor 走 cache）+ pack（产 zip + sha256）；tag 场景直传 release 资产，dispatch 走 artifact
#   - verify（仅 tag 场景）: 查 release 资产齐全，缺则删 release 并 fail（不留残缺）
#
# 与 dsh-hanako 的差异:
#   - 零 npm 依赖（package.json 无 dependencies）→ 无 pnpm install、无 lockfile
#   - vendor/ 内嵌 win-x64 运行时（git/gh/gnupg，fetch-vendor.mjs 下载，sha256 校验），
#     交付物平台相关（win 资产）但构建在 ubuntu 单平台完成（纯文件打包，不执行 win 二进制）
#   - gnupg 条目解压依赖 7z → build 前 apt 装 p7zip-full
#   - 产物目录 releases/（.gitignore 忽略），资产名 github-hanako-v<ver>.zip 与 tag 对齐
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists, skipping create"
          else
            gh release create "${{ github.ref_name }}" \
              --prerelease \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi

  build:
    needs: create-release
    # create-release 仅在 tag 场景运行，dispatch 场景会被 skip；被 needs 的 job skip 会
    # 让下游默认 if(success()) 一起 skip → 用 !cancelled() 显式放行 skipped 依赖链
    # （success(tag) / skipped(dispatch) 都继续构建），保留 failure/cancelled 门禁
    if: ${{ !cancelled() && needs.create-release.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # vendor 缓存：key 随 fetch-vendor.mjs（VERSIONS 表）变化，命中则免下载免解压
      - name: Cache vendor
        uses: actions/cache@v4
        with:
          path: |
            vendor
            _tmp/vendor-dl
          key: vendor-${{ hashFiles('scripts/fetch-vendor.mjs') }}

      - name: Install 7z
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Fetch vendor (git + gh + gnupg)
        run: node scripts/fetch-vendor.mjs

      - name: Package
        run: node scripts/pack.mjs

      - name: Upload release assets (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd releases
          ZIP=$(ls github-hanako-*.zip | head -1)
          [ -n "$ZIP" ] || { echo "::error::no package zip found in releases/"; exit 1; }
          gh release upload "${{ github.ref_name }}" "$ZIP" "$ZIP.sha256" --clobber

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: github-hanako-package
          retention-days: 3
          path: releases/github-hanako-*.zip*
          if-no-files-found: error

  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Verify release assets complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          ZIP="github-hanako-${TAG#v}.zip"
          if ! gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx "$ZIP"; then
            echo "::error::release $TAG missing asset $ZIP"
            gh release delete "$TAG" --yes
            exit 1
          fi
          if ! gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx "$ZIP.sha256"; then
            echo "::error::release $TAG missing asset $ZIP.sha256"
            gh release delete "$TAG" --yes
            exit 1
          fi
          echo "release $TAG assets complete: $ZIP + $ZIP.sha256"
